variables_order = "GPCS"
opcache.enable=1
opcache.enable_cli=1

; Document upload limits for local Laravel dev server
upload_max_filesize = 64M
post_max_size = 70M
max_execution_time = 300
memory_limit = 256M

; Windows PHP ships without a CA bundle, so outbound HTTPS (Stripe, OpenAI)
; fails with "cURL error 60" until curl/openssl are given one explicitly.
curl.cainfo = "d:\Bot\Laravel-Medquery-App-Single-Business\Laravel-Medquery-App-Single-Business\storage\certs\cacert.pem"
openssl.cafile = "d:\Bot\Laravel-Medquery-App-Single-Business\Laravel-Medquery-App-Single-Business\storage\certs\cacert.pem"
